/* Header Styles */

        nav ul {

        nav ul li {

        nav ul li a {

            font-weight: 500;

        /* Header Social Media Icons */
        .header-social-media {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-left: 1rem;
        }
        
        /* Debug: Make sure icons are visible */
        .header-social-media {
            visibility: visible !important;
        }

        .header-social-icon {
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            text-decoration: none;
            cursor: pointer;
            overflow: visible;
            opacity: 1 !important;
            vertical-align: middle;
        }
        
        .header-social-icon img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            filter: brightness(0) invert(0);

            mix-blend-mode: multiply;
            transition: none !important;

        /* Houzz icon is already black, so remove filter */

            filter: none;
            -webkit-filter: none;
            mix-blend-mode: normal;

            visibility: visible !important;

                        .footer-container {

                text-align: left;

}
        }

        /* Dropdown Menu */

            left: 0;

        .dropdown:hover .dropdown-menu,

        .dropdown-toggle::after {

            border-right: 4px solid transparent;

            margin-left: 0.5rem;

    <!-- Header will be loaded here -->

    <!-- Load Header and Footer -->
    <script src="../../header-footer.js"></script>
    
    <script>
        // Prevent concurrent loading and track loaded images
        let isLoadingGallery = false;
        let loadedImageNumbers = new Set();
        
        // Dynamic Gallery Image Loader
        async function loadGalleryImages() {
            // Prevent concurrent executions
            if (isLoadingGallery) {
                console.log('Gallery already loading, skipping duplicate call');
                return;
            }
            isLoadingGallery = true;
            
            const galleryGrid = document.getElementById('gallery-grid');
            if (!galleryGrid) {
                isLoadingGallery = false;
                return;
            }
            
            // Aggressively clear existing gallery items - remove all children
            while (galleryGrid.firstChild) {
                galleryGrid.removeChild(galleryGrid.firstChild);
            }
            galleryGrid.innerHTML = '';
            loadedImageNumbers.clear();
            
            const projectCategory = document.querySelector('.project-category')?.textContent.trim() || '';
            const projectName = document.querySelector('.project-name')?.textContent.trim() || '';
            
            if (!projectCategory || !projectName) {
                console.error('Could not find project category or name');
                return;
            }
            
            // Load images from current directory
            const imageBasePath = './';
            
            let imageNumber = 2; // Start from 2 (1 is the hero image)
            const loadedImages = [];
            const extensions = ['.jpg', '.jpeg']; // Try both extensions
            
            // Function to try loading an image
            function tryLoadImage(num) {
                return new Promise((resolve) => {
                    const img = new Image();
                    let triedExtensions = 0;
                    
                    function tryNextExtension() {
                        if (triedExtensions >= extensions.length) {
                            resolve(null); // No more extensions to try
                            return;
                        }
                        
                        const ext = extensions[triedExtensions];
                        img.src = `${imageBasePath}${num}${ext}`;
                        
                        img.onload = () => {
                            resolve({ number: num, extension: ext, element: img });
                        };
                        
                        img.onerror = () => {
                            triedExtensions++;
                            tryNextExtension();
                        };
                    }
                    
                    tryNextExtension();
                });
            }
            
            // Load images sequentially, skipping missing ones
            // Try up to image 100, or stop after 10 consecutive failures
            let consecutiveFailures = 0;
            const maxImageNumber = 100;
            const maxConsecutiveFailures = 10;
            
            while (imageNumber <= maxImageNumber && consecutiveFailures < maxConsecutiveFailures) {
                const result = await tryLoadImage(imageNumber);
                if (!result) {
                    consecutiveFailures++;
                    imageNumber++;
                    continue; // Skip missing image and continue
                }
                
                // Reset consecutive failures counter when we find an image
                consecutiveFailures = 0;
                
                // Check if we've already loaded this image number (prevent duplicates)
                if (loadedImageNumbers.has(imageNumber)) {
                    console.log(`Skipping duplicate image ${imageNumber}`);
                    imageNumber++;
                    continue;
                }
                
                // Mark this image number as loaded
                loadedImageNumbers.add(imageNumber);
                
                // Double-check: verify this image isn't already in the DOM
                const existingImg = galleryGrid.querySelector(`img[data-image-number="${imageNumber}"]`);
                if (existingImg) {
                    console.log(`Image ${imageNumber} already exists in DOM, skipping`);
                    imageNumber++;
                    continue;
                }
                
                // Create gallery item
                const galleryItem = document.createElement('div');
                galleryItem.className = 'gallery-item';
                const img = document.createElement('img');
                img.src = result.element.src;
                img.alt = projectName;
                img.dataset.imageNumber = imageNumber; // Track image number
                
                // Wait for image to actually load before adding to array
                await new Promise((resolve) => {
                    if (img.complete) {
                        resolve();
                    } else {
                        img.onload = resolve;
                        img.onerror = resolve; // Continue even if image fails to load
                    }
                });
                
                galleryItem.appendChild(img);
                galleryGrid.appendChild(galleryItem);
                
                loadedImages.push(img);
                imageNumber++;
            }
            
            
            
            isLoadingGallery = false;
        }
        
        // Load gallery images when page is ready - with debouncing
        let initTimeout = null;
        let isInitializing = false;
        
        function initializePage() {
            // Reset for SPA navigation
            
            // Prevent multiple simultaneous initializations
            if (isInitializing || isLoadingGallery) {
                console.log('Already initializing or loading, skipping duplicate call');
                return;
            }
            
            // Clear any pending initialization
            if (initTimeout) {
                clearTimeout(initTimeout);
                initTimeout = null;
            }
            
            isInitializing = true;
            
            // Use requestAnimationFrame to ensure DOM is ready, then add delay
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    initTimeout = setTimeout(() => {
                        // Double-check we're not already loading before starting
                        if (!isLoadingGallery) {
                            loadGalleryImages();
                        }
                        isInitializing = false;
                        initTimeout = null;
                    }, 150);
                });
            });
        }
        
        // Store handler reference for cleanup (use unique key per page)
        const pageKey = 'galleryInit_castro';
        if (window[pageKey]) {
            const oldHandler = window[pageKey];
            document.removeEventListener('DOMContentLoaded', oldHandler);
            window.removeEventListener('pageContentLoaded', oldHandler);
        }
        window[pageKey] = initializePage;
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', window[pageKey], { once: true });
        } else {
            initializePage();
        }
        
        // Also load when page content is loaded via SPA navigation
        window.addEventListener('pageContentLoaded', window[pageKey], { once: false });
    </script>
</body>
</html>
